name: release

# Cut a release by pushing a tag:
#
#   git tag -a v0.1.1 -m v0.1.1 && git push origin v0.1.1
#
# This creates the GitHub release, then renders packaging/homebrew/cursorwrap.rb.tmpl
# with the version and the sha256 of the source tarball and commits it to the tap.
#
# Requires a repo secret HOMEBREW_TAP_TOKEN: a PAT with contents:write on
# a-grasso/homebrew-tap (the same tap reflock and portbook publish to).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    # Job-level so the publish step's `if:` can see it. A step's own `env:` is
    # not in scope for that step's own `if:`.
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag is the only source of the published version, so without this a
      # tag could ship a formula whose `cursorwrap --version` disagrees with the
      # release it came from. Runs before anything is published or pushed.
      - name: Refuse a tag that disagrees with VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          src_version="$(sed -n 's/^let version = "\(.*\)"$/\1/p' main.swift)"
          if [ "$tag_version" != "$src_version" ]; then
            echo "tag $GITHUB_REF_NAME says $tag_version, main.swift says $src_version" >&2
            exit 1
          fi
          echo "tag and VERSION agree on $src_version"

      # Shipping a formula that cannot build is the one failure a user sees
      # first, so build the way the formula does before publishing anything.
      - name: Build from a clean checkout
        run: |
          ./build.sh
          ./CursorWrap.app/Contents/MacOS/cursorwrap --version

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Checksum the source tarball
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          for i in 1 2 3 4 5; do
            curl -fsSL -o src.tar.gz "$url" && break
            echo "tarball not ready, retry $i"; sleep 3
          done
          echo "sha256=$(shasum -a 256 src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Skip rather than fail where the secret is absent - a fork, or a tag
      # pushed before the PAT is in place, should still get its release instead
      # of a red run at `git clone`.
      - name: Publish formula to tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/a-grasso/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@@VERSION@@/${VERSION}/" -e "s/@@SHA256@@/${SHA256}/" \
            packaging/homebrew/cursorwrap.rb.tmpl > tap/Formula/cursorwrap.rb
          ruby -c tap/Formula/cursorwrap.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cursorwrap.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "cursorwrap ${VERSION}"
          git push
